<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>番薯仔大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:wght@700&family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@500;900&display=swap">
<style>
/* Layout: one full-screen stage, a 16:9 game canvas centred on night-market dark; DOM sheets (signboards) float above it */
:root{
  --night:#140d24;
  --ink:#f7ecd8;
  --lantern:#d93a2b;
  --lantern-deep:#8e2117;
  --gold:#f5b630;
  --gold-deep:#a8730e;
  --jade:#2fa58a;
  --muted:#b3a6c9;
  --panel:#21173a;
  --panel-2:#2c1f4a;
  --edge:#4a3870;
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-roman:"Charis SIL","Gentium Plus","Noto Serif","Times New Roman",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;box-sizing:border-box;padding-inline:16px;padding-block:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#stage{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2px var(--edge),0 18px 50px rgba(0,0,0,.55);max-width:100%}
#game{display:block;width:100%;height:100%}
#corner{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.ic{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,240,210,.5);background:rgba(20,12,36,.55);color:var(--ink);font:700 16px var(--f-body);cursor:pointer;display:grid;place-items:center}
.ic:focus-visible,.btn:focus-visible,.tile:focus-visible,.lv:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

#pad{display:none;width:100%;max-width:640px;justify-content:space-between;align-items:center;gap:12px}
#pad .grp{display:flex;gap:12px}
#pad button{width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,240,210,.45);background:rgba(44,31,74,.85);color:var(--ink);font:900 24px var(--f-body);touch-action:none}
#pad #bJ{width:88px;height:88px;background:rgba(217,58,43,.85);font-family:var(--f-display);font-size:28px}
#pad button.on{transform:scale(.93);background:rgba(245,182,48,.85);color:#3a1d00}
@media (hover:none) and (pointer:coarse){
  #pad{display:flex}
}
@media (hover:none) and (pointer:coarse) and (orientation:landscape){
  #pad{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:none;padding-inline:24px;box-sizing:border-box;pointer-events:none}
  #pad button{pointer-events:auto;opacity:.8}
}

/* overlay sheets */
#ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(10,6,22,.74);backdrop-filter:blur(3px)}
.sheet{width:min(880px,100%);max-height:100%;overflow:auto;background:var(--panel);border:2px solid var(--edge);border-radius:20px;box-sizing:border-box;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.sheet.narrow{width:min(560px,100%)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
p{margin:0;line-height:1.7}
.roman{font-family:var(--f-roman);font-weight:700;letter-spacing:.01em}
.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{font:700 18px var(--f-display);padding:12px 22px;border-radius:12px;border:0;background:var(--lantern);color:#fff6e0;box-shadow:0 5px 0 var(--lantern-deep);cursor:pointer;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lantern-deep)}
.btn.gold{background:var(--gold);color:#3a1d00;box-shadow:0 5px 0 var(--gold-deep)}
.btn.gold:active{box-shadow:0 2px 0 var(--gold-deep)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--edge)}
.btn small{font:500 12px var(--f-body);opacity:.75;margin-left:6px}

/* title */
.title{text-align:center;align-items:center}
.logo{font-size:clamp(40px,8vw,72px);color:var(--gold);line-height:1.1;text-shadow:0 4px 0 var(--lantern-deep),0 0 30px rgba(245,182,48,.35)}
.logo-sub{font-size:clamp(16px,3vw,22px);color:var(--ink)}
.cast{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:480px}
.heroes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:560px}
.hero{border:2px solid var(--edge);background:var(--panel-2);color:var(--ink);border-radius:14px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-body);min-width:0}
.hero canvas{width:64px;height:56px}
.hero b{font-family:var(--f-display);font-size:18px}
.hero .roman{font-size:13px;color:var(--gold)}
.hero .hd{font-size:12px;color:var(--muted)}
.hero[aria-pressed="true"]{border-color:var(--gold);background:rgba(245,182,48,.16);box-shadow:0 0 0 2px rgba(245,182,48,.35)}
.hero:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.cast figure{margin:0;background:var(--panel-2);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cast canvas{width:64px;height:56px}
.cast b{font-family:var(--f-display);font-size:17px}
.cast .roman{font-size:13px;color:var(--gold)}
.cast span:last-child{font-size:12px;color:var(--muted)}
.keys{font-size:13px;color:var(--muted)}
kbd{font:700 12px var(--f-body);border:1px solid var(--edge);border-bottom-width:3px;border-radius:6px;padding:1px 6px;color:var(--ink)}

/* map */
.lvgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.lvgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lv h3{word-break:keep-all}
.lv{position:relative;text-align:left;cursor:pointer;border:2px solid var(--edge);border-radius:16px;padding:14px;background:var(--panel-2);color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column;gap:6px;min-width:0}
.lv:hover:not([disabled]){border-color:var(--gold)}
.lv[disabled]{opacity:.45;cursor:not-allowed}
.lv .no{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.lv h3{font-size:28px}
.lv .roman{color:var(--gold);font-size:15px}
.lv .sub{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:700 14px var(--f-roman);padding:2px 9px;border-radius:999px;background:rgba(245,182,48,.14);color:var(--gold)}
.stars{color:var(--gold);letter-spacing:2px;font-size:18px}
.stars .off{color:var(--edge)}
.lv .band{height:6px;border-radius:3px;margin-bottom:4px}

/* letter card */
.card{display:grid;grid-template-columns:180px minmax(0,1fr);gap:22px}
.ctile{background:var(--gold);color:#3a1d00;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:18px 10px;box-shadow:inset 0 -6px 0 var(--gold-deep)}
.ctile .kind{font:700 14px var(--f-display);background:#3a1d00;color:var(--gold);border-radius:999px;padding:2px 12px}
.ctile .big{font:700 76px/1 var(--f-roman)}
.ctile .zy{font:700 18px var(--f-body)}
.tip{font-size:17px}
.words{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.words li{display:grid;grid-template-columns:44px 52px minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--panel-2);border-radius:12px;padding:8px 14px}
.words .emo{font-size:30px}
.words .han{font:900 32px var(--f-body)}
.words .tl{font:700 28px var(--f-roman)}
.words .tl mark{background:none;color:var(--gold);text-decoration:underline 3px;text-underline-offset:5px}
.words .mean{color:var(--muted);font-size:14px}

/* book */
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.tile{border:2px solid var(--edge);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile b{font:700 28px var(--f-roman)}
.tile span{font-size:12px;color:var(--muted)}
.tile.got{border-color:var(--gold);background:rgba(245,182,48,.12)}
.tile.got span{color:var(--gold)}
.note{font-size:13px;color:var(--muted)}

.seg{display:inline-flex;border:2px solid var(--edge);border-radius:12px;overflow:hidden}
.seg button{font:700 15px var(--f-display);padding:8px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button .roman{font-size:12px;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--gold);color:#3a1d00}
.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.diff{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.diff div{background:var(--panel-2);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:20px}
.diff i{font-style:normal;color:var(--muted);font-size:14px}
.diff span:last-child{color:var(--gold)}
.words li.lo{grid-template-columns:44px minmax(0,1fr)}
body.lo{--f-display:var(--f-roman);--f-body:var(--f-roman)}
body.lo .logo{font-size:clamp(32px,6vw,56px)}
body.lo .lv h3{font-size:24px}
.seg.big{flex-wrap:wrap}
.seg.big button{font-size:18px;padding:10px 20px}
.seg.big button .roman{font-size:13px}
body.jet #pad{display:none!important}
/* result */
.bigstars{font-size:54px;letter-spacing:8px;color:var(--gold);text-align:center;line-height:1}
.bigstars .off{color:var(--edge)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.stats div{background:var(--panel-2);border-radius:12px;padding:10px}
.stats b{display:block;font:900 26px var(--f-body);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}

@media (max-width:700px){
  .card{grid-template-columns:minmax(0,1fr)}
  .ctile{flex-direction:row;gap:16px;padding:12px}
  .ctile .big{font-size:56px}
  .words li{grid-template-columns:36px 40px minmax(0,1fr);}
  .words .mean{grid-column:3}
  .heroes{gap:6px}
  .hero canvas{width:52px;height:46px}
  .sheet{padding:18px}
}
@media (max-width:460px){.lvgrid{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="遊戲畫面"></canvas>
    <div id="corner">
      <button class="ic" id="bMute" aria-label="音效開關" title="音效 (M)">♪</button>
      <button class="ic" id="bPause" aria-label="暫停" title="暫停 (P)">II</button>
    </div>
  </div>
  <div id="pad">
    <div class="grp"><button id="bL" aria-label="往左">◀</button><button id="bR" aria-label="往右">▶</button></div>
    <button id="bJ" aria-label="跳">跳</button>
  </div>
</div>
<div id="ov" hidden><div class="sheet" id="sheet"></div></div>

<script>
(()=>{
'use strict';
const W=960,H=540,T=40,GY=460;
const GRAV=2300,JV=860,ACC=1900,FRIC=2100,MAXV=270;
const FD_H='"LXGW WenKai TC","Noto Sans TC","Microsoft JhengHei",sans-serif',FB_H='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif';
let FD=FD_H,FB=FB_H;
const FR='"Charis SIL","Gentium Plus","Noto Serif","Times New Roman",serif';
const $=s=>document.querySelector(s);
const cv=$('#game'),ctx=cv.getContext('2d'),stage=$('#stage');

/* ---------- utils ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r=Math.random){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function oval(c,x,y,rx,ry,rot=0){c.beginPath();c.ellipse(x,y,rx,ry,rot,0,Math.PI*2);c.fill()}
function txt(s,x,y,font,color,align='left',base='alphabetic'){ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline=base;ctx.fillText(s,x,y)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- content: Tâi-lô letters ---------- */
const LETTERS={};
function defL(key,type,zy,tip,words){LETTERS[key]={key,type,zy,tip,words:words.map(([h,t,m,e])=>({h,t,m,e}))}}
defL('p','子音','','雙唇合起來再放開，氣流輕輕的，不送氣。',[['飛','[p]ue','飛','🕊️'],['包','[p]au','包子','🥟']]);
defL('ph','子音','','跟 {p} 同一個位置，但氣要噴出來。手放嘴前，會感覺到風！',[['炮','[ph]àu','鞭炮','🧨'],['鼻','[ph]īnn','鼻子','👃']]);
defL('b','子音','華語無','台語特有的濁音！像英語的 b：雙唇合起來，喉嚨要震動。',[['米','[b]í','米','🍚'],['帽','[b]ō','帽子','🧢']]);
defL('m','子音','','雙唇合起來，聲音從鼻子出來。',[['麵','[m]ī','麵','🍜'],['媽','[m]á','阿媽（祖母）','👵']]);
defL('t','子音','','舌尖頂住上牙齦再放開，不送氣。',[['茶','[t]ê','茶','🍵'],['豬','[t]i','豬','🐷']]);
defL('th','子音','','跟 {t} 同一個位置，但要送氣，氣噴出來。',[['糖','[th]n̂g','糖','🍬'],['天','[th]inn','天','☁️']]);
defL('n','子音','','舌尖頂住上牙齦，聲音從鼻子出來。',[['年','[n]î','年','🧧'],['籃','[n]â','籃子','🧺']]);
defL('l','子音','','舌尖輕輕點一下上牙齦，比華語的 l 更輕、更快。',[['人','[l]âng','人','🧍'],['路','[l]ōo','路','🛣️']]);
defL('k','子音','','舌根頂住上顎再放開，不送氣。',[['狗','[k]áu','狗','🐕'],['雞','[k]e','雞','🐔']]);
defL('kh','子音','','跟 {k} 同一個位置，但要送氣。',[['腳','[kh]a','腳','🦶'],['褲','[kh]òo','褲子','👖']]);
defL('g','子音','華語無','台語特有的濁音！像英語的 g：舌根頂住上顎，喉嚨要震動。',[['牛','[g]û','牛','🐄'],['鵝','[g]ô','鵝','🦢']]);
defL('ng','子音','','鼻音 {ng} 放佇字的開頭：舌根頂住上顎，聲音從鼻子出來。',[['硬','[ng]ē','硬','🪨'],['雅','[ng]á','優雅','🌸']]);
defL('h','子音','','從喉嚨輕輕吐氣，比華語的 h 更輕柔。',[['魚','[h]î','魚','🐟'],['花','[h]ue','花','🌺']]);
defL('ts','子音','','舌尖先頂住上牙齦，再慢慢放開，不送氣。',[['水','[ts]uí','水','💧'],['書','[ts]u','書','📖']]);
defL('tsh','子音','','跟 {ts} 同一個位置，但要送氣。',[['車','[tsh]ia','車','🚗'],['菜','[tsh]ài','菜','🥬']]);
defL('s','子音','','舌尖靠近上牙齦，留一條縫讓氣流擦出去。',[['獅','[s]ai','獅子','🦁'],['山','[s]uann','山','⛰️']]);
defL('j','子音','華語無','台語特有的濁音！像英語 z 的濁音，喉嚨要震動。',[['字','[j]ī','字','🔤'],['熱','[j]ua̍h','熱','🔥']]);
defL('a','母音','','嘴巴張大，自然發出聲音。',[['鴨','[a]h','鴨子','🦆'],['腳','kh[a]','腳','🦶']]);
defL('i','母音','','嘴角往兩邊拉開。',[['椅','[í]','椅子','🪑'],['豬','t[i]','豬','🐷']]);
defL('u','母音','','嘴唇圓圓的，往前嘟。',[['牛','g[û]','牛','🐄'],['龜','k[u]','烏龜','🐢']]);
defL('e','母音','','嘴巴半開，嘴角稍微拉開。',[['鞋','[ê]','鞋子','👟'],['雞','k[e]','雞','🐔']]);
defL('o','母音','','嘴唇微圓，舌頭較後。台語的 {o} 和 {oo} 是兩個不同的音！',[['蚵','[ô]','蚵仔','🦪'],['刀','t[o]','刀子','🔪']]);
defL('oo','母音','','嘴巴張得比 {o} 大，嘴唇圓圓的。',[['烏','[oo]','黑色','⚫'],['箍','kh[oo]','圓圈','⭕']]);
defL('ai','複合母音','','從 {a} 滑到 {i}。',[['海','h[ái]','海','🌊'],['獅','s[ai]','獅子','🦁']]);
defL('au','複合母音','','從 {a} 滑到 {u}。',[['狗','k[áu]','狗','🐕'],['包','p[au]','包子','🥟']]);
defL('ia','複合母音','','從 {i} 滑到 {a}。',[['寫','s[iá]','寫字','✍️'],['車','tsh[ia]','車','🚗']]);
defL('iu','複合母音','','從 {i} 滑到 {u}，尾音嘴唇要圓。',[['手','tsh[iú]','手','✋'],['秋','tsh[iu]','秋天','🍂']]);
defL('io','複合母音','','從 {i} 滑到 {o}，華語無這个組合！',[['笑','tsh[iò]','笑','😄'],['蕉','ts[io]','香蕉（芎蕉）','🍌']]);
defL('ua','複合母音','','從 {u} 滑到 {a}。',[['紙','ts[uá]','紙','📄'],['沙','s[ua]','沙','🏖️']]);
defL('ue','複合母音','','從 {u} 滑到 {e}。',[['火','h[ué]','火','🔥'],['飛','p[ue]','飛','🕊️']]);
defL('ui','複合母音','','從 {u} 滑到 {i}，尾音是清楚的 {i}。',[['水','ts[uí]','水','💧'],['開','kh[ui]','開門','🚪']]);
defL('iau','複合母音','','{i}＋{a}＋{u} 三个音連做伙。',[['枵','[iau]','肚子餓','🍽️'],['貓','n[iau]','貓','🐈']]);

    .replace(new RegExp(`o(${TONE}?)o`,'g'),'o$1͘')
    .replace(new RegExp(`([uU])(\\]?)(${TONE}?)([ae])`,'g'),(m,u,b,t,v)=>(u==='U'?'O':'o')+b+t+v)

    .replace(/nn(?=\]?(?:$|[-\s]|h))/g,'ⁿ')
    .replace(new RegExp(`i(${TONE}?)(ng|k)`,'g'),'e$1$2');
  return s.normalize('NFC');
}

function sched(){
  const {tr,spb}=A.song;

/* ---------- physics ---------- */
const live=s=>!s.dead&&!(s.kind==='barrier'&&s.open>=0);
function moveX(o,dx){o.x+=dx;let hit=false;for(const s of G.solids){if(!live(s)||!overlap(o,s))continue;if(dx>0)o.x=s.x-o.w;else if(dx<0)o.x=s.x+s.w;hit=true}if(hit)o.vx=0;return hit}
function moveY(o,dy){o.y+=dy;o.onGround=false;let head=null,best=1e9;
  for(const s of G.solids){if(!live(s)||!overlap(o,s))continue;
    if(dy>0){o.y=s.y-o.h;o.vy=0;o.onGround=true}
    else if(dy<0){const d=Math.abs(s.x+s.w/2-(o.x+o.w/2));if(d<best){best=d;head=s}}}
  if(head){o.y=head.y+head.h;o.vy=0}
  return head;
}
const solidAt=(x,y)=>G.solids.some(s=>live(s)&&x>=s.x&&x<=s.x+s.w&&y>=s.y&&y<=s.y+s.h);

function bump(s){
  const g=G,p=g.p;
  s.bump=.15;
  if(s.kind==='teach'&&!s.used){
    s.used=true;SFX.card();burst(s.x+20,s.y,'#ffd36a',18);
    float(s.x+20,s.y-14,lab(s.key),'#ffd36a',30,FR);
    SAVE.book[s.key]=true;persist();
    s.board=0;g.boards=(g.boards||0)+1;
  }else if(s.kind==='brick'){
    SFX.bump();
    if(s.pearl){s.pearl=false;gain(1);SFX.pearl();g.parts.push({kind:'pearl',x:s.x+20,y:s.y-10,vy:-380,life:.55,max:.55})}
  }else if(s.kind==='answer'){
    const q=s.gate;
    if(q.solved||s.state){SFX.bump();return}
    if(q.boss){bossAnswer(s,q);return}
    if(s.key===q.key){
      s.state='right';q.solved=true;q.barrier.open=0;
      q.blocks.forEach(b=>{if(b!==s&&!b.state)b.state='dim'});
      SFX.right();setTimeout(SFX.open,250);
      burst(s.x+20,s.y,'#ffd36a',26,320);
      float(s.x+20,s.y-20,X('著！ tio̍h!','Tio̍h!'),'#ffe27a',30,FD);

      gain(3);persist();
    }else{
      s.state='wrong';q.wrong++;g.wrong++;SFX.wrong();
      burst(s.x+20,s.y,'#9a8fb0',12,180);
      float(s.x+20,s.y-20,X('毋著 m̄-tio̍h','M̄-tio̍h'),'#ff8a7a',24,FD);
      const L=LETTERS[q.key];

      g.enemies.push(mkMosq(mx,GY-130,50));burst(mx+14,GY-130,'#cfd6e6',10,120);
    }
  }else SFX.bump();
}

function bossAnswer(s,q){
  const g=G,b=g.boss;
  if(s.key===q.key){
    s.state='right';SFX.right();burst(s.x+20,s.y,'#ffd36a',26,320);gain(2);

      q.blocks.forEach(x=>{if(!x.state)x.state='dim'});

function autopilot(g,dt){

function update(dt){
  if(G.kind==='jet'){updateJet(dt);return}

  if(g.auto&&autopilot(g,dt))return;
  if(g.pending){g.pending.t-=dt;if(g.pending.t<=0){const k=g.pending.key;g.pending=null;showCard(k,true);return}}
  const dir=(K.right?1:0)-(K.left?1:0);
  if(dir){p.vx+=dir*ACC*dt*(p.onGround?1:.8);p.face=dir}
  else{const f=FRIC*dt*(p.onGround?1:.35);p.vx=Math.abs(p.vx)<=f?0:p.vx-Math.sign(p.vx)*f}
  p.vx=clamp(p.vx,-MAXV,MAXV);
  p.coyote=p.onGround?.1:p.coyote-dt;p.jbuf-=dt;

  if(p.inv>0)p.inv-=dt;

  if(p.y>H+60){fell();if(mode!=='play')return}

  // pearls
  for(const q of g.pearls){if(q.taken)continue;if(Math.abs(p.x+13-q.x)<22&&Math.abs(p.y+17-q.y)<36){q.taken=true;gain(1);SFX.pearl();g.parts.push({kind:'spark',x:q.x,y:q.y,life:.3,max:.3})}}

    <div><div class="eyebrow">${fromGame?X('收集著新字母！','Siu-tsi̍p tio̍h sin jī-bó!'):X('字母簿','Jī-bó-phōo')}</div></div>
    ${cardHTML(key)}
    <div class="row" style="justify-content:flex-end"><button class="btn gold" data-default id="ok">${fromGame?X('記牢矣，繼續','Kì-tiâu--ah, kè-sio̍k')+' ▶':X('轉去','Tńg--khì')}</button></div>
  </div>`);
  $('#ok').onclick=()=>{if(fromGame){hideOv();mode='play'}else back()};
}
function romSwitch(){
  return `<div class="seg" role="group" aria-label="拼音系統">
    <button type="button" data-rom="tl" aria-pressed="${SAVE.rom==='tl'}">${isLo()?'':'台羅 '}<span class="roman">Tâi-lô</span></button>
    <button type="button" data-rom="poj" aria-pressed="${SAVE.rom==='poj'}">${isLo()?'':'白話字 '}<span class="roman">Pe̍h-ōe-jī</span></button></div>`;
}
function scriptSwitch(){
  return `<div class="seg" role="group" aria-label="${X('文字','Bûn-jī')}">
    <button type="button" data-script="han" aria-pressed="${!isLo()}">${isLo()?'':'漢羅 '}<span class="roman">${R('Hàn-lô')}</span></button>
    <button type="button" data-script="lo" aria-pressed="${isLo()}">${isLo()?'':'全羅 '}<span class="roman">${R('Tsuân-lô')}</span></button></div>`;
}
function bindScript(redraw){sheet.querySelectorAll('[data-script]').forEach(b=>b.onclick=()=>{if(SAVE.script===b.dataset.script)return;SAVE.script=b.dataset.script;persist();applyScript();redraw()})}
function bindRom(redraw){sheet.querySelectorAll('[data-rom]').forEach(b=>b.onclick=()=>{if(SAVE.rom===b.dataset.rom)return;SAVE.rom=b.dataset.rom;persist();applyScript();redraw()})}
function showBook(back){
  const tile=k=>`<button class="tile ${SAVE.book[k]?'got':''}" data-k="${k}"><b>${esc(lab(k))}</b><span>${SAVE.book[k]?'✓':typeName(LETTERS[k].type)}</span></button>`;
  const n=Object.keys(SAVE.book).filter(k=>LETTERS[k]).length;
  const diff=[['ts','ch'],['tsh','chh'],['oo','o͘'],['ua','oa'],['ue','oe'],['nn','ⁿ'],['ing','eng'],['ik','ek']];
  showOv(`<div class="stack">
    <div class="row" style="justify-content:space-between"><div><div class="eyebrow">${X('已收集','Í-king siu-tsi̍p')} ${n} / ${ALL.length}</div><h2 style="font-size:32px">${X('字母簿','Jī-bó-phōo')}</h2></div><div class="row">${scriptSwitch()}${romSwitch()}<button class="btn gold" data-default id="back">${X('轉去','Tńg--khì')}</button></div></div>
    <h3 style="font-size:20px">${X('子音（聲母）','Tsú-im')} ${INITIALS.length} ${X('个','ê')}</h3><div class="bookgrid">${INITIALS.map(tile).join('')}</div>
    <h3 style="font-size:20px">${X('母音（韻母）','Bó-im')} ${VOWELS.length} ${X('个','ê')}</h3><div class="bookgrid">${VOWELS.map(tile).join('')}</div>
    <h3 style="font-size:20px">${X('複合母音','Ho̍k-ha̍p bó-im')} ${COMPOUNDS.length} ${X('个','ê')}</h3><div class="bookgrid">${COMPOUNDS.map(tile).join('')}</div>
    <h3 style="font-size:20px">${X('鼻化韻','Phīnn-huà-ūn')} ${NASAL.length} ${X('个','ê')}</h3><div class="bookgrid">${NASAL.map(tile).join('')}</div>
    <h3 style="font-size:20px">${X('入聲（尾音）','Ji̍p-siann')} ${CHECKED.length} ${X('个','ê')}</h3><div class="bookgrid">${CHECKED.map(tile).join('')}</div>
    <h3 style="font-size:20px">${X('聲調','Siann-tiāu')} ${TONES.length} ${X('个','ê')}</h3><div class="bookgrid">${TONES.map(tile).join('')}</div>
    <h3 style="font-size:20px">${X('台羅和白話字無仝的所在','Tâi-lô kah Pe̍h-ōe-jī bô kâng ê sóo-tsāi')}</h3>
    <div class="diff">${diff.map(([t,p])=>`<div><span class="roman">${t}</span><i>→</i><span class="roman">${p}</span></div>`).join('')}</div>
    <p class="note">${X(`台羅是教育部 2006 年公告的「臺灣台語羅馬字拼音方案」；白話字（教會羅馬字）有超過百年的歷史。兩種寫法的聲調符號仝款，差別主要佇頂面這幾項。b、g、j 是台語特有的濁音，華語無。各地腔口有差，例如「雞」有人講 kue、「火」有人講 hé。`,'Tâi-lô sī Kàu-io̍k-pōo 2006 nî kong-kò ê phing-im hong-àn; Pe̍h-ōe-jī í-king ū pah gōa nî ê le̍k-sú. Nn̄g-hāng ê siann-tiāu hû-hō sio-kâng. B, g, j sī Huâ-gí bô ê im. Kok-tē khiunn-kháu bô kâng, pí-lūn ke ū lâng kóng kue.')}</p>
  </div>`);
  sheet.querySelectorAll('.tile').forEach(b=>b.onclick=()=>showCard(b.dataset.k,false,()=>showBook(back)));
  $('#back').onclick=back;bindRom(()=>showBook(back));bindScript(()=>showBook(back));
}
function showPause(){
  if(mode!=='play')return;mode='pause';
  showOv(`<div class="stack" style="align-items:center;text-align:center"><h2 style="font-size:36px">${X('歇睏一下','Hioh-khùn--tsi̍t-ē')}</h2>${isLo()?'':`<p class="roman" style="color:var(--gold)">${R('Hioh-khùn--tsi̍t-ē')}</p>`}
    <div class="row" style="justify-content:center">${scriptSwitch()}${romSwitch()}</div>
    <div class="row" style="justify-content:center"><button class="btn gold" data-default id="r">${X('繼續','Kè-sio̍k')}</button><button class="btn ghost" id="b">${X('字母簿','Jī-bó-phōo')}</button><button class="btn ghost" id="m">${X('回地圖','Tńg-khì tē-tôo')}</button></div></div>`,true);
  $('#r').onclick=resume;bindRom(()=>{mode='play';showPause()});bindScript(()=>{mode='play';showPause()});$('#b').onclick=()=>showBook(()=>{mode='play';showPause()});$('#m').onclick=showMap;
}
function resume(){hideOv();mode='play'}
function showResult(){
  const g=G,s=g.wrong===0?3:g.wrong<=2?2:1;
  SAVE.stars[starKey(g.li)]=Math.max(SAVE.stars[starKey(g.li)]||0,s);persist();
  const nextOk=g.def.n<LAST;
  showOv(`<div class="stack" style="text-align:center;align-items:center">
    <div class="eyebrow">${kuanName(g.li)} ${X(g.def.name,g.def.tl)}</div>
    <h2 style="font-size:40px;color:var(--gold)">${X('過關！','Kuè-kuan!')}${isLo()?'':`<span class="roman" style="font-size:22px;color:var(--ink)"> ${R('Kuè-kuan!')}</span>`}</h2>
    ${starsHTML(s,'bigstars')}
    <div class="stats" style="width:100%"><div><b>${g.got}</b><span>${X('珍珠','tsin-tsu')}</span></div><div><b>${g.wrong}</b><span>${X('答毋著','ìn m̄-tio̍h')}</span></div><div><b>${g.gates.length}</b><span>${X('字母','jī-bó')}</span></div></div>
    <div class="chips" style="justify-content:center">${g.keys.map(k=>`<span class="chip">${esc(lab(k))}</span>`).join('')}</div>
    <p class="note">${s===3?X('全部攏答對，誠厲害！','Tsuân-pōo lóng ìn tio̍h, tsiânn lī-hāi!'):X('答毋著的字母，會使去字母簿閣看一擺。','Ìn m̄-tio̍h ê jī-bó, ē-sái khì jī-bó-phōo koh khuànn tsi̍t-pái.')}</p>
    <div class="row" style="justify-content:center">
      ${nextOk?`<button class="btn gold" data-default id="n">${X('下一關','Āu tsi̍t kuan')} ▶</button>`:''}
      <button class="btn ${nextOk?'ghost':'gold'}" ${nextOk?'':'data-default'} id="a">${g.def.challenge?X('閣挑戰一擺','Koh thiau-tsiàn tsi̍t-pái'):X('閣玩一擺','Koh sńg tsi̍t-pái')}</button>
      <button class="btn ghost" id="m">${X('地圖','Tē-tôo')}</button></div>
  </div>`,true);
  if(nextOk)$('#n').onclick=()=>startLevel(g.li+1);
  $('#a').onclick=()=>startLevel(g.li);$('#m').onclick=showMap;
}
function showOver(){
  showOv(`<div class="stack" style="text-align:center;align-items:center">
    <h2 style="font-size:36px">${X(hero().name+'忝矣……',hero().tl+' thiám--ah...')}</h2>${isLo()?'':'<p class="roman" style="color:var(--gold)">Thiám--ah</p>'}
    <p>${X('無要緊，閣來一擺！','Bô-iàu-kín, koh lâi tsi̍t-pái!')}</p>
    <div class="row" style="justify-content:center"><button class="btn gold" data-default id="a">${X('再試一擺','Koh tshì tsi̍t-pái')}</button><button class="btn ghost" id="m">${X('地圖','Tē-tôo')}</button></div></div>`,true);
  $('#a').onclick=()=>startLevel(G.li);$('#m').onclick=showMap;
}

/* ---------- input ---------- */
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyZ:'jump',KeyK:'jump'};
addEventListener('keydown',e=>{
  if(e.code==='KeyM'){toggleMute();return}
  if(G&&G.auto&&mode==='play'&&ov.hidden){e.preventDefault();endDemo();return}
  if(!ov.hidden){
    if(e.code==='Escape'&&mode==='pause'){resume();return}
    if((e.code==='Enter'||e.code==='Space')&&!e.repeat){const d=sheet.querySelector('[data-default]');if(d&&document.activeElement!==d){e.preventDefault();d.click()}else if(e.code==='Space'&&!document.activeElement?.matches('button')){e.preventDefault()}}
    return;
  }
  const j=JETMAP[e.code];if(j){e.preventDefault();K[j]=true}
  const k=KEYMAP[e.code];
  if(k){e.preventDefault();if(k==='jump'&&!e.repeat&&!K.jump&&G&&mode==='play')G.p.jbuf=.12;K[k]=true}
  if((e.code==='KeyP'||e.code==='Escape')&&mode==='play')showPause();
});
const JETMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)K[k]=false;const j=JETMAP[e.code];if(j)K[j]=false});
addEventListener('blur',()=>{if(G&&G.auto)return;K.left=K.right=K.jump=K.up=K.down=false;if(mode==='play')showPause()});
function bindPad(id,key){const b=$(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();if(G&&G.auto&&mode==='play'){endDemo();return}try{b.setPointerCapture(e.pointerId)}catch(_){};if(key==='jump'&&!K.jump&&G&&mode==='play')G.p.jbuf=.12;K[key]=true;b.classList.add('on')});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,()=>{K[key]=false;b.classList.remove('on')}));
  b.addEventListener('contextmenu',e=>e.preventDefault());}
bindPad('#bL','left');bindPad('#bR','right');bindPad('#bJ','jump');
$('#bPause').onclick=()=>{if(G&&G.auto&&mode==='play'){endDemo();return}if(mode==='play')showPause()};
stage.addEventListener('pointerdown',e=>{if(G&&G.auto&&mode==='play'&&e.target===cv)endDemo()});
function jetTouch(e){if(!G||(G.kind!=='jet'&&G.kind!=='sea')||mode!=='play'||e.target!==cv)return;e.preventDefault();const r=cv.getBoundingClientRect();G.touch={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{ensureAudio();jetTouch(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(G&&G.touch)jetTouch(e)});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{if(G)G.touch=null}));
cv.style.touchAction='none';
let jetClass=false;
$('#bMute').onclick=()=>{ensureAudio();toggleMute()};
$('#bMute').textContent=SAVE.muted?'×':'♪';

/* ---------- sizing & loop ---------- */
function fit(){
  const app=$('#app'),pad=$('#pad'),ps=getComputedStyle(pad);
  const padH=ps.display!=='none'&&ps.position!=='fixed'?pad.offsetHeight+12:0;
  const aw=app.clientWidth-32,ah=app.clientHeight-16-padH;
  const s=Math.max(.2,Math.min(aw/W,ah/H)),cw=Math.floor(W*s),ch=Math.floor(H*s);
  stage.style.width=cw+'px';stage.style.height=ch+'px';
  const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);scale=cv.width/W;
}
addEventListener('resize',fit);
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(G){
    if(mode==='play')update(dt);
    else if(mode==='win')updateWin(dt);
    else if(mode==='menu'){G.t+=dt;G.camX=(G.camX+dt*45)%(G.width-W)}
    else if(mode==='over'){G.t+=dt;stepParts(dt)}
    render();
    const jc=(G.kind==='jet'||G.kind==='sea')&&mode!=='menu';if(jc!==jetClass){jetClass=jc;document.body.classList.toggle('jet',jc);fit()}
  }
  requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)try{hot.snapshot(()=>({save:SAVE}))}catch(e){}
function boot(data){
  if(data&&data.save)Object.assign(SAVE,data.save);
  applyScript();fit();showTitle();requestAnimationFrame(frame);
}
hot&&hot.ready?hot.ready(boot):boot(hot&&hot.data||{});
})();
</script>
